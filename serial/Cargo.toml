[package]
name = "serial-tool"
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
build = "build.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
dirs = "6"
encoding_rs = "0.8"
rfd = "0.15"
serialport = "4"
slint = { version = "1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }

[build-dependencies]
embed-manifest = "1.5.0"
slint-build = "1.17.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
